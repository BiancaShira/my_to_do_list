
<!DOCTYPE html>
<html lang="en">
<head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title> {%block title%} 
                            {%endblock%}
              </title>
              <style>
                            .to_do {
                                padding: 10px;
                                margin: 5px;
                                background-color: #f3f3f3
                            }
                            body{
                                          background-color: rgb(220, 190, 209);
                                          color: rgb(232, 16, 153);
                            }
                    
                        </style>
                    </head>
                    <body>
                            <nav>
                                          <div style="font-size: larger;font-weight: bold; display: flex;">Bee To do list</div>
                            <ul style="display: flex;">
                                         <li class="home"><a href="/">Home</a></li>
                                         <li class = "list"><a href="/list">List</a></li>
                                </ul>
                            </nav>
                        <hr>
                        <div class="content">
                            {% block content %} {% endblock %}
                        </div>
                    </body>
                    <style>
                      .home{

                                          padding: 8px 16px;
                                          background-color: rgb(218, 66, 203);
                                          color: rgb(255, 255, 255);
                                          text-align: center;
                                          border-radius: 12px;
                                          font-size: 18px;
                                          font-weight: 700;
                                          text-decoration: none;
                                          list-style: none;
                                          

                            }   
                            .list{

                                            padding: 8px 16px;
                                            background-color: rgb(218, 66, 203);
                                            color: rgb(255, 255, 255);
                                            text-align: center;
                                            border-radius: 12px;
                                            font-size: 18px;
                                            font-weight: 700;
                                            text-decoration: none;
                                            list-style: none;


                                            }   
                            ul{
                                          display: flex;
                                          gap: 12px;
                            }     
                            
                            nav{
                                          display: flex;
                                           justify-content: space-between;
                                          align-items: center;
                                          color: purple;
                                   }
                                   a:hover{

                                          color: rgb(253, 23, 96);
                                          transition: all .5s;
                                   }
                                   a{
                                          color: black;
                                          text-decoration: none;
                                   }
                                   
                                   
                    </style>
                    </html>
